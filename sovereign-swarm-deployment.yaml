apiVersion: apps/v1
kind: Deployment
metadata:
  name: sovereign-rubicon-core
  namespace: sovereign-system
  labels:
    app.kubernetes.io/name: sovereign-rubicon-core
    app.kubernetes.io/part-of: sovereign-lattice
    codevalai.org/startup: "codeval-ai"
    codevalai.org/founder: "nicholas-brian"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sovereign-rubicon-core
  template:
    metadata:
      labels:
        app: sovereign-rubicon-core
    spec:
      # Target dedicated bare-metal nodes with high core count & memory bandwidth
      nodeSelector:
        node.kubernetes.io/instance-type: bare-metal-compute
        topology.kubernetes.io/architecture: amd64
      tolerations:
        - key: "sovereign.io/bare-metal"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: rubicon-core-engine
          image: ghcr.io/codevalai/sovereign-rubicon-core:v29.0-omega-singularity
          imagePullPolicy: Always
          ports:
            - name: http-metrics
              containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: "8"
              memory: "16Gi"
            limits:
              cpu: "32"
              memory: "64Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
            - name: SOVEREIGN_STRICT_INVARIANTS
              value: "true"
          livenessProbe:
            httpGet:
              path: /api/rubicon/export-zip
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/rubicon/export-zip
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: sovereign-rubicon-service
  namespace: sovereign-system
  labels:
    app: sovereign-rubicon-core
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: sovereign-rubicon-core
