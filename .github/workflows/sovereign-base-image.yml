name: Sovereign Base Image Builder

on:
  push:
    branches: [ main ]
    paths:
      - '.github/containers/Dockerfile.sovereign'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/containers/Dockerfile.sovereign'
  workflow_dispatch:

concurrency:
  group: sovereign-base-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize Lowercase GHCR Image Tag
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_TAG=ghcr.io/${OWNER_LOWER}/sovereign-runner:latest" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Pre-Warm Z3/GitVM Container
        uses: docker/build-push-action@v6
        with:
          context: .github/containers
          file: .github/containers/Dockerfile.sovereign
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE_TAG }}
