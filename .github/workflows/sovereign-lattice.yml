name: Sovereign Lattice CI/CD & Verification Grid

on:
  push:
    branches: [ main, master, 'feature/sovereign-*' ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * *' # Daily autonomous security and invariant audit sweep

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sovereign-lattice-pipeline:
    name: Sovereign Lattice Verification Mesh
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout Sovereign Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize Node.js Environment (${{ matrix.node-version }})
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install System Dependencies & Z3 SMT Prover
        run: |
          sudo apt-get update && sudo apt-get install -y libz3-dev python3-z3
          npm ci

      - name: 1. Post-Quantum ML-DSA-65 Signature Verification
        env:
          ROOT_PUBLIC_KEY: ${{ secrets.SOVEREIGN_ROOT_ML_DSA_PUBKEY }}
        run: |
          echo "Executing FIPS 204 ML-DSA-65 signature validation across HEAD commit..."
          npm run verify:mldsa -- --commit="${{ github.sha }}"

      - name: 2. SMT Invariant Verification (Z3 Satisfiability Check)
        run: |
          echo "Running formal SMT solver checks on kernel invariants (Target: >90% Rigor)..."
          npx tsx scripts/verify-smt-invariants.ts --threshold=90

      - name: 3. Hybrid X25519 + ML-KEM Cryptographic Combiner Test
        run: |
          echo "Validating HKDF-SHA3-512 joint encapsulation and key rotation protocols..."
          npm run build
