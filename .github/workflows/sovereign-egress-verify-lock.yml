name: Sovereign Egress & Lockfile Enforcement

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: sovereign-egress-lock-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  verify-lock-and-egress:
    name: Immutable Lockfile & Egress Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Sovereign Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Verify Lockfile Integrity (Zero-Network HTTPS & SRI Audit)
        run: |
          echo "[+] Verifying package-lock.json cryptographic invariants..."
          if [ ! -f "package-lock.json" ]; then
            echo "[-] CRITICAL: package-lock.json missing from root. Zero-mock invariant violated."
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
            const pkgs = Object.entries(lock.packages || {});
            let checked = 0;
            for (const [name, meta] of pkgs) {
              if (!name) continue;
              if (meta.resolved) {
                if (!meta.resolved.startsWith("https://registry.npmjs.org/")) {
                  throw new Error(`Untrusted registry URL for ${name}: ${meta.resolved}`);
                }
                if (!meta.integrity) {
                  throw new Error(`Missing SRI integrity hash for ${name}`);
                }
                checked++;
              }
            }
            console.log(`[LOCKFILE-AUDIT] Verified ${checked} locked dependencies use HTTPS registry.npmjs.org with SRI digests.`);
          '
          npm ci --legacy-peer-deps --ignore-scripts

      - name: Enforce Isolated Kernel Netns Egress Airgap & Execute Master Suite
        run: |
          chmod +x scripts/enforce-egress-airgap.sh
          sudo -E env "PATH=$PATH" bash scripts/enforce-egress-airgap.sh airgap-exec -- npx tsx scripts/verify-sovereign-singularity-master.ts
