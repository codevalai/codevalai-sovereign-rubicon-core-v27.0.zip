name: Sovereign HDC & zkML Verification Pipeline

on:
  push:
    branches: [ "main", "hdc-zkml/*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: sovereign-hdc-zkml-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-hdc-zkml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sovereign Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Execute HDC Hypervector, 1.58-Bit Ternary Weight, Live AST PKZIP & 100 Workflows Suite
        run: npx tsx scripts/verify-hdc-zkml-invariants.ts
