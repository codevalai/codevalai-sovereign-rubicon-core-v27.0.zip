name: Sovereign Omni-Ecosystem & Clone Factory REA Verification

on:
  push:
    branches:
      - main
      - 'refs/swarm/**'
      - 'refs/nexus/**'
  pull_request:

jobs:
  verify-omni-ecosystem-mesh:
    name: Verify CXL.mem 3.1, 3-Phase HotStuff BFT, Vector Bitmap Diff & Clone Factory REA ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sovereign Repository with Full Pack & Bitmap Depth
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Static Type Verification
        run: npm run lint

      - name: Execute Omni-Ecosystem Mesh, Bitmap Diff & Clone Factory REA PKZIP Verifier
        run: npx tsx scripts/verify-omni-ecosystem-mesh.ts
