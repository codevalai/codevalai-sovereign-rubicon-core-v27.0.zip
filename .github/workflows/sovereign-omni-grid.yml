name: Sovereign Omni-Ecosystem & Clone Factory REA Verification

on:
  push:
    branches:
      - main
      - master
      - 'swarm/**'
      - 'nexus/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: sovereign-omni-grid-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-omni-ecosystem-mesh:
    name: Verify CXL.mem 3.1, 3-Phase HotStuff BFT, Vector Bitmap Diff & Clone Factory REA ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sovereign Repository with Full Pack & Bitmap Depth
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run TypeScript Static Type Verification
        run: npm run lint

      - name: Execute Omni-Ecosystem Mesh, Bitmap Diff & Clone Factory REA PKZIP Verifier
        run: npx tsx scripts/verify-omni-ecosystem-mesh.ts
